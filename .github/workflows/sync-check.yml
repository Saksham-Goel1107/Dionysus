name: Sync & Quality Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for uncommitted changes after build/lint/format
        run: |
          npm ci --legacy-peer-deps
          npm run build || true
          npx eslint . --ext .js,.jsx,.ts,.tsx || true
          npx prettier --check . || true
          git status
          git diff --exit-code
        shell: bash
