name: Sync & Quality Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for uncommitted changes after build/lint/format
        run: |
          npm ci
          npm run build || true
          npx eslint . --ext .js,.jsx,.ts,.tsx || true
          npx prettier --check . || true
          git status
          git diff --exit-code
        shell: bash
      - name: Fail if there are uncommitted changes
        run: |
          if [[ $(git status --porcelain) ]]; then
            echo "Uncommitted changes detected! Please sync your code and re-run checks." && exit 1
          fi
        shell: bash
